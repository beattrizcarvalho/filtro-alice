
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jardim Encantado da Alice 🦋</title>
  
<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

</head>
<body>
    
  <h1>Jardim Encantado da Alice 🌸</h1>

  <p>Prepare seu sorriso para uma foto encantada!</p>

    
<div class="area-filtro">

  <video id="camera" autoplay playsinline muted></video>

  <img
    class="moldura"
    src="img/moldura.png"
    alt="Moldura do Jardim Encantado"
  >

  
<h2 class="frase-filtro">
  <span>1 ano no Jardim Encantado da</span>

  <span class="nome-alice">
    <img src="img/letra-a.png" alt="A" class="letra-a">
    <span>lice</span>
  </span>
</h2>


</div>

<button id="tirarFoto">📸 Tirar foto</button>

<p id="aviso-camera">
  Preparando a câmera do seu Jardim Encantado... 🦋
</p>


<script src="js/script.js"></script>

</body>
</html>
